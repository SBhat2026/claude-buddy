<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>buddy</title>
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden;
               -webkit-user-select:none; user-select:none; cursor:default; }
  #stage { position:relative; width:420px; height:320px; }
  canvas { position:absolute; inset:0; width:420px; height:320px; image-rendering:pixelated; }
  #bubble {
    position:absolute; left:50%; transform:translateX(-50%);
    max-width:240px; padding:5px 9px; border-radius:9px;
    background:#fffdf7; color:#2b1a14; border:2px solid #2b1a14;
    font:12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
    text-align:center; pointer-events:none; opacity:0;
    transition:opacity .16s ease; white-space:pre-wrap;
    box-shadow:2px 2px 0 rgba(43,26,20,.22);
  }
  #bubble.on { opacity:1; }
  #talk {
    position:absolute; left:50%; transform:translateX(-50%);
    display:none; align-items:center; gap:6px;
    background:#fffdf7; border:2px solid #2b1a14; border-radius:9px;
    padding:4px 8px; box-shadow:2px 2px 0 rgba(43,26,20,.22);
  }
  #talk.on { display:flex; }
  #talk .caret { color:#c4785a; font:12px ui-monospace, Menlo, monospace; }
  #talk input {
    border:0; outline:0; background:transparent; width:190px; color:#2b1a14;
    font:12px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  #talk:after {
    content:""; position:absolute; left:50%; bottom:-7px; margin-left:-5px;
    border:5px solid transparent; border-top-color:#2b1a14; border-bottom:0;
  }
  #bubble:after {
    content:""; position:absolute; left:50%; bottom:-7px; margin-left:-5px;
    border:5px solid transparent; border-top-color:#2b1a14; border-bottom:0;
  }
</style>
</head>
<body>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="bubble"></div>
  <div id="talk"><span class="caret">&gt;</span><input id="talkInput" spellcheck="false"
       autocomplete="off" placeholder="say something"></div>
</div>
<script src="common.js"></script>
<script>
const WIN_W = 420, WIN_H = 320, CX = 210, BASE_Y = 268;
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const bubbleEl = document.getElementById("bubble");
const talkEl = document.getElementById("talk");
const talkInput = document.getElementById("talkInput");

let state = window.CB.mergeState(null);
let anims = window.CB.animationsOf(state);
let palette = window.CB.paletteFor(state.look.colors);
let miniPalette = window.CB.paletteFor({ body: "#d99a80" });

let screenRect = { x: 0, y: 0, w: 1440, h: 860 };
let mouse = { x: 0, y: 0, ok: false };

/* He stands on two kinds of thing: the floor, and whatever is on your screen —
   a search field, a toolbar, a row of tabs, the top edge of the window itself. */
const SURFACES = {
  floor:    { up: { x: 0, y: -1 }, angle: 0, axis: "x" },
  platform: { up: { x: 0, y: -1 }, angle: 0, axis: "x" }
};

const pet = {
  x: 300, y: 700, vx: 0, vy: 0, facing: 1, surface: "floor", dir: 1, platform: null,
  action: "idle", frame: 0, frameT: 0, actionT: 0, hold: 2,
  target: null, dragging: false, grabDX: 0, grabDY: 0,
  lastInteraction: Date.now() / 1000, asleep: false
};

/* the ball, and short-lived things like dust and hearts */
let ball = null;
let effects = [];
let platforms = [];    /* things on screen he can stand on, top edges */
let windowLedge = null;
let uiList = [];
let goal = null;       /* one he built himself                  */
let drone = null;
let mini = null;       /* his own small pet, on a leash          */
let play = { until: 0, keepies: 0, sinceRest: 0 };

let winX = -9999, winY = -9999, hovering = false, ignoring = true;
let bubbleBottom = -1;

/* ---------- native bridge ---------- */
function send(type, payload) {
  try { window.webkit.messageHandlers.buddy.postMessage(Object.assign({ type: type, view: "pet" }, payload || {})); }
  catch (e) {}
}

window.__onNative = function (msg) {
  if (!msg || !msg.type) return;
  if (msg.type === "state") applyState(msg.state);
  else if (msg.type === "screen") {
    screenRect = msg.rect;
    if (pet.y < screenRect.y || pet.y > screenRect.y + screenRect.h) pet.y = ground();
    clampX();
    rebuildPlatforms();
  }
  else if (msg.type === "mouse") { mouse.x = msg.x; mouse.y = msg.y; mouse.ok = true; }
  else if (msg.type === "command") command(msg.cmd, msg);
  else if (msg.type === "context") onContext(msg);
  else if (msg.type === "platforms") {
    uiList = (msg.list || []).map(p => ({
      x0: p.x, x1: p.x + p.w, y: p.y, role: p.role || "", label: p.label || ""
    }));
    rebuildPlatforms();
  }
  else if (msg.type === "modelReply") onModelReply(msg);
  else if (msg.type === "models") adoptModel(msg.list);
};

let hadState = false;
function applyState(raw) {
  const before = Object.keys(anims || {});
  state = window.CB.mergeState(raw);
  anims = window.CB.animationsOf(state);
  palette = window.CB.paletteFor(state.look.colors);
  const c = window.CB.resolveColors(state.look.colors);
  miniPalette = window.CB.paletteFor({ body: window.CB.mix(c.body, "#ffffff", 0.22), dark: c.dark });
  if (!anims[pet.action]) setAction("idle");
  rollGoalDay();
  clampX();
  /* Something new appeared in his animation list, which can only mean you drew it. */
  const added = Object.keys(anims).filter(k => before.indexOf(k) < 0);
  if (hadState && added.length) celebrate(added[0]);
  if (!hadState) setTimeout(arrival, 600);
  hadState = true;
}

/* ---------- geometry ---------- */
const scale = () => Math.max(1, Math.min(8, Number(state.look.scale) || 3.6));
const spriteW = () => window.CB.GRID * scale();
const ground = () => screenRect.y + screenRect.h - 2;
const minX = () => screenRect.x + (state.behavior.edgeMargin || 24);
const maxX = () => screenRect.x + screenRect.w - (state.behavior.edgeMargin || 24);
function clampX() { pet.x = Math.max(minX(), Math.min(maxX(), pet.x)); }
const topY = () => screenRect.y + 24;
const onFloor = () => pet.surface === "floor" && pet.y >= ground() - 1;
const surfaceDef = () => SURFACES[pet.surface] || SURFACES.floor;
const surfaceY = () => (pet.surface === "platform" && pet.platform ? pet.platform.y : ground());

/* How far he can walk before he runs out of whatever he is standing on. */
function surfaceBounds() {
  if (pet.surface === "platform" && pet.platform) {
    const p = pet.platform;
    const pad = Math.min(10, Math.max(4, (p.x1 - p.x0) * 0.12));
    return { min: p.x0 + pad, max: p.x1 - pad };
  }
  return { min: minX(), max: maxX() };
}

function standOnFloor() {
  pet.surface = "floor";
  pet.platform = null;
  pet.y = ground();
  pet.vx = pet.vy = 0;
}

function letGo() {
  pet.surface = "floor";
  pet.platform = null;
  pet.vy = 20;
  setAction("fall", 9999);
}

/* ---------- things on screen ----------
   A platform is a real thing you are using: the search field, the toolbar, the tab
   strip, the top edge of the window. He treats their top edges as shelves. */

const usePlatforms = () => state.behavior.useWindows !== false;

function platformKey(p) { return `${p.role}|${p.label}|${Math.round(p.x1 - p.x0)}`; }

/* The window's top edge and everything the accessibility tree offered, filtered to
   the ones that are actually above the floor and wide enough to stand on. */
function rebuildPlatforms() {
  const all = (windowLedge ? [windowLedge] : []).concat(usePlatforms() ? uiList : []);
  platforms = all
    .filter(p => p.y < ground() - 24 && p.y > screenRect.y + 4 && (p.x1 - p.x0) > 48)
    .filter((p, i, a) => a.findIndex(q => Math.abs(q.y - p.y) < 6 && Math.abs(q.x0 - p.x0) < 24) === i)
    .slice(0, 24);

  /* the thing he was standing on may have moved, or stopped existing */
  if (pet.surface === "platform" && pet.platform) {
    const key = platformKey(pet.platform);
    const still = platforms.find(p => platformKey(p) === key);
    if (!still) { letGo(); return; }
    pet.platform = still;
    if (pet.x < still.x0 + 4 || pet.x > still.x1 - 4) letGo();
    else pet.y = still.y;
  }
}

/* A toolbar lives near the top of the screen and he lives at the bottom, which is
   eight hundred pixels of rise — a sensible little hop could never reach one, so he
   does not do sensible little hops. He crouches first and then launches. */
function reachable(p, fromY, fromX) {
  const rise = fromY - p.y;
  return rise > 26 && rise < 900 && Math.abs((p.x0 + p.x1) / 2 - fromX) < 760 && (p.x1 - p.x0) > 40;
}

function pickPlatform() {
  if (!usePlatforms()) return null;
  const here = surfaceY();
  const options = platforms.filter(p => p !== pet.platform && reachable(p, here, pet.x));
  if (!options.length) return null;
  return options[(Math.random() * options.length) | 0];
}

/* The crouch is not decoration: an eight-hundred-pixel leap that starts instantly
   reads as a glitch, and the same leap with a wind-up reads as a jump. */
function hopTo(p) {
  if (!p) return false;
  pet.pendingHop = p;
  pet.target = null;
  const aim = (p.x0 + p.x1) / 2;
  if (Math.abs(aim - pet.x) > 8) pet.facing = Math.sign(aim - pet.x);
  setAction("jump", 0.42);
  return true;
}

function launchHop(p) {
  pet.pendingHop = null;
  const g = state.behavior.gravity || 1400;
  const rise = Math.max(30, surfaceY() - p.y);
  pet.vy = -Math.sqrt(2 * g * (rise + 44));
  /* aim for the nearest part of it he can stand on, not its middle */
  const aim = Math.max(p.x0 + 14, Math.min(p.x1 - 14, pet.x));
  const airtime = Math.max(0.25, (Math.abs(pet.vy) / g) * 1.3);
  pet.vx = Math.max(-620, Math.min(620, (aim - pet.x) / airtime));
  pet.y -= 1;
  pet.surface = "floor";
  pet.platform = null;
  puff(pet.x, pet.y, 2);
  setAction("fall", 8);
}

function landOn(p) {
  pet.platform = p;
  pet.surface = "platform";
  pet.y = p.y;
  pet.vx = 0; pet.vy = 0;
  setAction("land", 0.3);
  puff(pet.x, p.y, 1);
  if (p.label && Math.random() < 0.35) {
    say(quipFor(p), 3.2);
    if (anims.point) setTimeout(() => { if (pet.surface === "platform") setAction("point", 3); }, 400);
  }
}

function quipFor(p) {
  const what = (p.label || p.role || "").toLowerCase();
  if (/search|find|query/.test(what)) return "anything good?";
  if (/tab/.test(what)) return "so many tabs";
  if (/toolbar|tool/.test(what)) return "nice shelf";
  if (/send|submit|save/.test(what)) return "don't mind me";
  if (/window/.test(what)) return "good view";
  return "up here";
}
const toWinX = sx => CX + (sx - pet.x);
const toWinY = sy => BASE_Y + (sy - pet.y);

/* ---------- actions ---------- */
function setAction(name, holdSeconds) {
  if (!anims[name]) name = "idle";
  /* chilling is a thing you do with someone */
  if (name === "chill" && !mini && state.behavior.walkPet !== false && onFloor()) walkTheDog();
  if (pet.action !== name) { pet.frame = 0; pet.frameT = 0; }
  pet.action = name;
  pet.actionT = 0;
  pet.hold = holdSeconds == null ? 2.5 : holdSeconds;
  pet.asleep = (name === "sleep" || name === "abed" || name === "nap");
}

function say(text, seconds) {
  if (!text) return;
  bubbleEl.textContent = text;
  bubbleEl.classList.add("on");
  clearTimeout(say._t);
  say._t = setTimeout(() => bubbleEl.classList.remove("on"), (seconds || 2.8) * 1000);
}
function randomPhrase() {
  const p = (window.CB.PERSON && window.CB.PERSON.phrases) || state.behavior.phrases || [];
  return p.length ? p[(Math.random() * p.length) | 0] : null;
}
function walkTo(x, run) {
  pet.target = Math.max(minX(), Math.min(maxX(), x));
  setAction(run ? "run" : "walk", 12);
}

/* ---------- effects ---------- */
function puff(x, y, count) {
  for (let i = 0; i < (count || 2); i++) {
    effects.push({ name: "puff", x: x + (Math.random() * 26 - 13), y: y - 4, vy: -14 - Math.random() * 14,
                   vx: (Math.random() * 2 - 1) * 22, life: 0.55, t: 0, scale: Math.max(1, scale() - 2) });
  }
}
function heart(x, y) {
  effects.push({ name: "heart", x: x, y: y, vy: -26, vx: 0, life: 1.3, t: 0, scale: Math.max(2, scale() - 1) });
}
function updateEffects(dt) {
  for (const e of effects) { e.t += dt; e.x += e.vx * dt; e.y += e.vy * dt; e.vy *= 0.96; }
  effects = effects.filter(e => e.t < e.life);
}

/* ---------- the ball ---------- */
/* about as big across as one of his legs is long */
const ballR = () => Math.max(4, scale() * 1.4);

function takeOutBall() {
  if (ball) return;
  ball = { x: pet.x + pet.facing * 26, y: ground() - ballR(), vx: 0, vy: -120, angle: 0, alpha: 0, out: false };
  play.keepies = 0;
  play.sinceRest = 0;
}
function putAwayBall() { if (ball) ball.out = true; }

function updateBall(dt) {
  if (!ball) return;
  ball.alpha = ball.out ? Math.max(0, ball.alpha - dt * 2.2) : Math.min(1, ball.alpha + dt * 3.5);
  if (ball.out && ball.alpha <= 0) { ball = null; return; }

  const g = ground(), r = ballR();
  ball.vy += (state.behavior.gravity || 1400) * 0.8 * dt;
  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;
  ball.angle += (ball.vx * dt) / ballR();   /* it rolls rather than spins on the spot */

  if (ball.y + r >= g) {
    ball.y = g - r;
    if (Math.abs(ball.vy) > 40) { ball.vy = -ball.vy * 0.62; play.sinceRest = 0; }
    else { ball.vy = 0; ball.vx *= 0.90; }
    if (Math.abs(ball.vy) < 8 && Math.abs(ball.vx) < 6) { ball.vx = 0; play.keepies = 0; }
  } else {
    ball.vx *= 0.995;
  }

  /* he keeps it close — the window is only so wide */
  const tether = 170;
  if (ball.x < pet.x - tether) { ball.x = pet.x - tether; ball.vx = Math.abs(ball.vx) * 0.7; }
  if (ball.x > pet.x + tether) { ball.x = pet.x + tether; ball.vx = -Math.abs(ball.vx) * 0.7; }
  if (ball.x < minX()) { ball.x = minX(); ball.vx = Math.abs(ball.vx) * 0.7; }
  if (ball.x > maxX()) { ball.x = maxX(); ball.vx = -Math.abs(ball.vx) * 0.7; }
}

function tryKick(dt) {
  if (!ball || ball.out || pet.dragging) return;
  const near = Math.abs(ball.x - pet.x) < 20 + scale() * 2;
  const low = ball.y > ground() - 26 - scale() * 3;
  if (!near || !low) return;
  if (pet.action === "kick" && pet.actionT < 0.35) return;
  const away = goal ? (Math.sign(goal.x - pet.x) || pet.facing) : (Math.sign(ball.x - pet.x) || pet.facing);
  pet.facing = away;
  ball.vx = away * (60 + Math.random() * 110);
  ball.vy = -(180 + Math.random() * 200);
  play.sinceRest += 1;
  play.keepies += 1;
  setAction("kick", 0.45);
  pet.target = null;
  if (play.keepies > (state.stats.bestKeepies || 0)) {
    state.stats.bestKeepies = play.keepies;
    if (play.keepies % 5 === 0) send("saveState", { state: state });
  }
  if (play.keepies === 5) say("five!");
  else if (play.keepies > 5 && play.keepies % 10 === 0) say(play.keepies + " in a row");
}

function startPlaying(seconds) {
  if (!state.behavior.playBall) return;
  takeOutBall();
  play.until = Date.now() / 1000 + (seconds || 20);
  setAction("walk", 12);
  if (Math.random() < 0.5) say("watch this");
}
const isPlaying = () => ball && !ball.out && Date.now() / 1000 < play.until;


/* ---------- his day ----------
   What he does depends on the hour and on how much he has been doing. Left to dice
   rolls he repeats the same six things forever; with a clock he cooks at mealtimes,
   works in the morning, sits about in the evening and goes to bed at night. */

const day = { stamina: 1, routine: null, phaseKey: null, seenApps: {} };

function hourNow() { const d = new Date(); return d.getHours() + d.getMinutes() / 60; }
function phaseNow() { return window.CB.phaseAt(hourNow()); }
function todayKey() { return new Date().toISOString().slice(0, 10); }
const followClock = () => state.behavior.followClock !== false;

/* What each thing costs him, and what gives it back, per second.
   Calibrated against a day rather than a minute: six minutes of solid running takes
   him from full to worn out, a quarter of an hour of football does the same, and
   walking about is nearly free. Idling recovers it over ten minutes or so, a nap in
   about ninety seconds, and a night in bed in a couple of minutes. */
const EFFORT = { run: 0.0028, jump: 0.0100, flip: 0.0100, kick: 0.0060, cheer: 0.0020,
                 carry: 0.0018, dance: 0.0018, clap: 0.0015, groove: 0.0014,
                 fall: 0.0008, walk: 0.0006, tiptoe: 0.0005 };
const REST   = { abed: 0.0100, sleep: 0.0100, nap: 0.0080, chill: 0.0030, sit: 0.0026,
                 drink: 0.0025, read: 0.0020, idle: 0.0017, think: 0.0015, desk: 0.0012 };

function tickStamina(dt) {
  const effort = (EFFORT[pet.action] || 0) + (isPlaying() ? 0.0010 : 0);
  const rest = REST[pet.action] || 0;
  day.stamina = Math.max(0, Math.min(1, day.stamina + (rest - effort) * dt));
}

/* "A significant amount of activity" is not a number of steps — it is being worn
   out. Below a fifth of his energy he stops whatever he is doing and lies down:
   properly in the bed if it is late, a doze on the spot if it is the afternoon. */
function wornOut() { return day.stamina < 0.2; }

function takeNap() {
  if (bed || !onFloor()) return;
  putAwayBall();
  setAction("nap", 70 + Math.random() * 40);
  if (Math.random() < 0.6) say("just five minutes", 3);
}

/* ── meals ── */
function mealDone(key) { return (state.stats.meals || {})[key] === todayKey(); }
function markMeal(key) {
  state.stats.meals = Object.assign({}, state.stats.meals || {});
  state.stats.meals[key] = todayKey();
  persist();
}

function startMeal(phase) {
  markMeal(phase.key);
  putAwayBall();
  day.routine = { steps: window.CB.MEAL_ROUTINE.slice(), i: -1, t: 0, until: 0, what: phase.title };
}

/* Driven by the frame clock like everything else, rather than by the wall clock:
   the difference does not show on a desktop, but it is what lets the whole meal be
   run through in a test in a tenth of a second. */
function runRoutine(dt) {
  const r = day.routine;
  if (!r) return false;
  r.t += dt;
  while (r.t >= r.until) {
    r.i++;
    if (r.i >= r.steps.length) { day.routine = null; return false; }
    const step = r.steps[r.i];
    r.until = r.t + step.seconds;
    if (!anims[step.anim]) continue;
    setAction(step.anim, step.seconds + 2);
    if (step.say) say(step.say, 3.5);
  }
  return true;
}

/* Anything he is allowed to choose: an animation you have not switched off, or one
   of the projects, if that project is switched on. */
function allowedNow(key) {
  const b = state.behavior;
  if (key === "ball") return b.playBall !== false && !busy();
  if (key === "goal") return b.buildGoal !== false && !busy();
  if (key === "drone") return b.flyDrone !== false && !busy();
  if (key === "dog") return b.walkPet !== false && !busy();
  if (!anims[key]) return false;
  const rot = state.rotation || [];
  return !rot.length || rot.indexOf(key) >= 0;
}

function doScheduled(key) {
  if (key === "ball") { startPlaying(14 + Math.random() * 14); return true; }
  if (key === "goal") { putUpGoal(); return true; }
  if (key === "drone") { flyDrone(); return true; }
  if (key === "dog") { walkTheDog(); return true; }
  if (key === "nap") { takeNap(); return true; }
  if (!anims[key]) return false;
  setAction(key, 3 + Math.random() * 4);
  return true;
}


/* ---------- birthdays ----------
   One day a year he wears a paper hat from the moment he wakes up, brings out a
   cake, and is no use for anything else. */

const party = { greeted: "", confettiAt: 0 };

function whoseBirthday() { return window.CB.birthdayToday(state.birthdays); }

function birthdayGreeting(who) {
  const name = who.name || (window.CB.PERSON && window.CB.PERSON.name) || "you";
  return "happy birthday, " + name + "!";
}

function confetti(x, y, n) {
  for (let i = 0; i < (n || 6); i++) {
    effects.push({ name: "confetti", x: x + (Math.random() * 70 - 35), y: y - Math.random() * 30,
                   vy: -30 - Math.random() * 40, vx: (Math.random() * 2 - 1) * 40,
                   life: 1.4 + Math.random(), t: 0, scale: Math.max(2, scale() * 0.5) });
  }
}

/* The first time this copy is ever opened, if it was made as a gift, he arrives out
   of a present rather than dropping onto the floor like any other day. */
function arrival() {
  const wanted = (window.CB.PERSON && window.CB.PERSON.entrance) || null;
  const opened = (state.stats && state.stats.opened) || 0;
  state.stats.opened = opened + 1;
  persist();
  if (wanted !== "present" || opened > 0) return false;
  pet.y = ground();
  pet.vy = 0;
  standOnFloor();
  setAction("present", 6);
  const who = whoseBirthday();
  say(who ? birthdayGreeting(who) : ("hello, " + ((window.CB.PERSON && window.CB.PERSON.name) || "you")), 7);
  confetti(pet.x, pet.y - 40, 12);
  setTimeout(() => { if (!pet.dragging) { setAction("cake", 8); confetti(pet.x, pet.y - 40, 8); } }, 6200);
  return true;
}

/* The moment he notices, once a day. */
function checkBirthday() {
  const who = whoseBirthday();
  if (!who) return;
  const stamp = todayKey() + ":" + who.name;
  if (party.greeted === stamp) return;
  party.greeted = stamp;
  setAction("present", 5);
  say(birthdayGreeting(who), 7);
  confetti(pet.x, pet.y - 40, 10);
  setTimeout(() => { if (!pet.dragging) { setAction("cake", 8); confetti(pet.x, pet.y - 40, 8); } }, 5200);
}

/* Anything soon, so he can mention it. */
function birthdaySoon() {
  let best = null;
  for (const b of (state.birthdays || [])) {
    const days = window.CB.daysUntil(b.date);
    if (days == null || days > 14 || days === 0) continue;
    if (!best || days < best.days) best = { name: b.name, days: days };
  }
  return best;
}

/* ---------- deciding what to do ---------- */
function nightHour() {
  const h = new Date().getHours();
  return h >= 23 || h < 6;
}
function sleepDelay() {
  const base = state.behavior.sleepAfter;
  if (!base) return 0;
  return (state.behavior.nightMode && nightHour()) ? Math.max(15, base * 0.4) : base;
}

function decide() {
  const b = state.behavior;
  const now = Date.now() / 1000;
  const nap = sleepDelay();

  if (nap > 0 && now - pet.lastInteraction > nap) { goToBed(); return; }

  const phase = phaseNow();
  if (followClock()) {
    /* worn out, or the small hours with nobody about */
    if (wornOut() && onFloor()) {
      if (phase.sleeps || phase.key === "winddown") goToBed(); else takeNap();
      return;
    }
    if (phase.sleeps && now - pet.lastInteraction > 90) { goToBed(); return; }

    /* mealtimes, once each per day */
    if (phase.meal && !mealDone(phase.key) && onFloor() && !busy()) { startMeal(phase); return; }
  }

  if (maybeCheckIn()) return;

  if (isPlaying()) { walkTo(ball.x - pet.facing * 6, Math.abs(ball.x - pet.x) > 120); return; }
  if (ball && !ball.out && now >= play.until) {
    putAwayBall();
    if (play.keepies > 2) say(play.keepies + " keepie-uppies");
    return;
  }

  if (b.followCursor && mouse.ok && Math.abs(mouse.x - pet.x) > 90) {
    walkTo(mouse.x + (Math.random() * 60 - 30), Math.abs(mouse.x - pet.x) > 420);
    return;
  }

  /* now and then he asks you for something, or starts a project of his own */
  if (onFloor() && !busy()) {
    const r0 = Math.random();
    if (r0 < 0.11 && b.buildGoal !== false) { putUpGoal(); return; }
    if (r0 < 0.16 && b.flyDrone !== false) { flyDrone(); return; }
    if (r0 < 0.21 && b.walkPet !== false) { walkTheDog(); return; }
    /* something on your screen is worth standing on */
    if (r0 < 0.32) {
      const p = pickPlatform();
      if (p) { hopTo(p); return; }
    }
  }

  /* a birthday takes over the whole day */
  const who = whoseBirthday();
  if (who && !busy() && onFloor() && Math.random() < 0.8) {
    const pick = window.CB.pickFromPool(window.CB.BIRTHDAY_POOL, k => !!anims[k]);
    if (pick && doScheduled(pick)) {
      if (Math.random() < 0.35) say(["happy birthday!", birthdayGreeting(who), "cake?", "many happy returns"][(Math.random() * 4) | 0], 4);
      if (pick === "party" || pick === "cheer") confetti(pet.x, pet.y - 40, 6);
      return;
    }
  }

  /* what the hour suggests — the largest single source of what he does */
  if (followClock() && Math.random() < 0.62) {
    const pick = window.CB.pickFromPool(phase.pool, allowedNow);
    if (pick && doScheduled(pick)) return;
  }

  /* over half the rest of the time he gets on with whatever you are getting on with */
  const act = aware.activity;
  if (act && Math.random() < 0.55) {
    if (act.do === "ball") { if (b.playBall) { startPlaying(14 + Math.random() * 14); return; } }
    else if (anims[act.do]) { setAction(act.do, 3 + Math.random() * 4); return; }
  }

  if (pet.surface === "platform") {
    const p = pet.platform;
    const b2 = surfaceBounds();
    if (Math.random() < 0.45) { pet.target = b2.min + Math.random() * (b2.max - b2.min); setAction("walk", 8); }
    else if (Math.random() < 0.25) { const next = pickPlatform(); if (next) { hopTo(next); return; } setAction("idle", 2); }
    else setAction((state.rotation || []).filter(k => anims[k])[0] || "idle", 2 + Math.random() * 2);
    void p;
    return;
  }

  const r = Math.random();
  const energy = Math.max(0, Math.min(1, b.energy == null ? 0.5 : b.energy));
  if (b.playBall && r < 0.14 + energy * 0.1) { startPlaying(14 + Math.random() * 16); return; }
  if (r < 0.5 + energy * 0.1) {
    const span = screenRect.w * (0.15 + energy * 0.5);
    walkTo(pet.x + (Math.random() * 2 - 1) * span, false);
  } else if (r < 0.6 + energy * 0.12) {
    walkTo(pet.x + (Math.random() < 0.5 ? -1 : 1) * screenRect.w * 0.4, true);
  } else if (r < 0.92) {
    const pool = (state.rotation || []).filter(k => anims[k]);
    const pick = pool.length ? pool[(Math.random() * pool.length) | 0] : "idle";
    setAction(pick, 2 + Math.random() * 3);
    if (Math.random() < 0.4) say(randomPhrase());
  } else {
    setAction("idle", 1.5 + Math.random() * 4);
  }
}

function command(cmd, msg) {
  pet.lastInteraction = Date.now() / 1000;
  if (cmd === "play" && anims[msg.anim]) setAction(msg.anim, msg.seconds || 4);
  else if (cmd === "ball") startPlaying(msg.seconds || 25);
  else if (cmd === "come") { if (mouse.ok) walkTo(mouse.x, true); }
  else if (cmd === "sleep") { goToBed(); }
  else if (cmd === "wake") { getUp(); say("morning"); }
  else if (cmd === "say") say(msg.text || "hi", 3.4);
  else if (cmd === "flip") setAction("flip", 0.6);
  else if (cmd === "goal") putUpGoal();
  else if (cmd === "drone") flyDrone();
  else if (cmd === "dog") walkTheDog();
  else if (cmd === "climb" || cmd === "hop") {
    const p = pickPlatform();
    if (p) hopTo(p); else say("nothing to jump onto", 2.5);
  }
  else if (cmd === "checkin") { checkin.last = 0; maybeCheckIn(); }
  else if (cmd === "birthday") {
    const who = whoseBirthday() || { name: state.name };
    party.greeted = "";
    setAction("present", 5);
    say(birthdayGreeting(who), 7);
    confetti(pet.x, pet.y - 40, 12);
    setTimeout(() => { if (!pet.dragging) { setAction("cake", 8); confetti(pet.x, pet.y - 40, 8); } }, 5200);
  }
  else if (cmd === "center") { pet.x = screenRect.x + screenRect.w / 2; pet.y = ground(); setAction("land", 0.4); }
  else if (cmd === "jump") { pet.vy = -520; pet.y -= 1; setAction("fall", 4); }
}

/* ---------- a local model, when one is switched on ---------- */
const aware = { lastApp: null, lastTitle: "", lastAsk: 0, pending: null, wasIdle: false,
                seq: 0, activity: null, context: null, seenOnce: false };

/* What you are doing, as he understands it: the first reaction whose pattern
   matches "<app> <window title>". This needs no model and no permission beyond the
   app name, and it is what actually ties him to your screen — the model only
   supplies the words on top. */
function matchReaction(app, title) {
  const hay = ((app || "") + " " + (title || "")).toLowerCase();
  for (const r of (state.reactions || [])) {
    if (!r || !r.match) continue;
    let re;
    try { re = new RegExp(r.match, "i"); } catch (e) { continue; }
    if (re.test(hay)) return r;
  }
  return null;
}

function onContext(ctx0) {
  const a = state.awareness || {};
  const now = Date.now() / 1000;
  const appChanged = ctx0.app && ctx0.app !== aware.lastApp;
  const titleChanged = (ctx0.title || "") !== aware.lastTitle;

  windowLedge = (ctx0.window && usePlatforms())
    ? { x0: ctx0.window.x, x1: ctx0.window.x + ctx0.window.w, y: ctx0.window.y, role: "Window", label: ctx0.app || "window" }
    : null;
  rebuildPlatforms();

  const hit = matchReaction(ctx0.app, a.seeTitle ? ctx0.title : "");
  aware.activity = hit;
  aware.context = ctx0;

  const cameBack = aware.wasIdle && ctx0.idle < 5;
  aware.wasIdle = ctx0.idle > 240;
  aware.lastApp = ctx0.app;
  aware.lastTitle = ctx0.title || "";

  if (pet.dragging || talk.open) return;
  if (pet.asleep) { if (cameBack) { pet.lastInteraction = now; setAction("idle", 1.5); } return; }

  /* an app he has not seen before gets looked at before anything else */
  if (appChanged && ctx0.app && !day.seenApps[ctx0.app]) {
    day.seenApps[ctx0.app] = true;
    if (!busy() && !pet.asleep && anims.peek && Math.random() < 0.5) {
      setAction("peek", 3.5);
      pet.lastInteraction = now;
      return;
    }
  }

  /* he changes what he is doing as soon as you change what you are doing */
  if ((appChanged || titleChanged) && hit && !isPlaying()) {
    pet.lastInteraction = now;
    if (hit.do === "ball") startPlaying(18);
    else if (anims[hit.do]) setAction(hit.do, 3 + Math.random() * 3);
    if (hit.say && Math.random() < 0.5) say(hit.say);
  }

  if (!a.enabled || !a.model) return;
  let reason = null;
  if (a.seeApp && appChanged) {
    reason = aware.seenOnce ? ("they just switched to " + ctx0.app) : ("they are working in " + ctx0.app);
    if (a.seeTitle && ctx0.title) reason += ', the window is called "' + ctx0.title + '"';
  }
  if (a.seeIdle && cameBack) {
    reason = "they have just come back to the keyboard";
    if (!busy() && !pet.asleep && anims.wave) setAction("wave", 2.5);
  }
  aware.seenOnce = true;
  if (!reason) return;
  if (now - aware.lastAsk < Math.max(20, a.minGap || 150)) return;
  ask(reason, ctx0);
}

function moveList() {
  return Object.keys(anims).filter(k => ["idle", "walk", "run", "sleep", "held", "fall", "land"].indexOf(k) < 0);
}

/* Ollama constrains generation to this, so `do` can only ever be a move he has. */
function replySchema(maxWords) {
  return {
    type: "object",
    properties: { say: { type: "string" }, do: { type: "string", enum: moveList() } },
    required: ["say", "do"]
  };
}

/* A 1B model will happily echo a placeholder like "<seven words>" straight back. */
function clean(text, limit) {
  return String(text || "")
    .replace(/[<>{}]/g, " ")
    .replace(/\s+/g, " ")
    .trim()
    .slice(0, limit || 60);
}

function situation(ctx0) {
  const a = state.awareness || {};
  const bits = [];
  if (a.seeTime) bits.push("It is " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) + ".");
  if (a.seeIdle && ctx0 && ctx0.idle > 120) bits.push("They were away for " + Math.round(ctx0.idle / 60) + " minutes.");
  else if (a.seeApp && ctx0 && ctx0.app) bits.push("They are in " + ctx0.app + ".");
  return bits.join(" ");
}

function ask(reason, ctx0) {
  const a = state.awareness || {};
  if (!a.enabled || !a.model) return;
  aware.lastAsk = Date.now() / 1000;
  const id = "r" + (++aware.seq);
  aware.pending = id;
  send("askModel", {
    id: id, endpoint: a.endpoint, model: a.model, timeoutMs: 30000, temperature: 0.9, maxTokens: 60,
    schema: replySchema(7),
    system: (a.persona || "") + " Keep every reply to at most seven lowercase words. Never ask a question.",
    prompt: reason.charAt(0).toUpperCase() + reason.slice(1) + ". " + situation(ctx0) +
            " Say one short thing about it, and pick a move."
  });
}

function parseReply(text) {
  try { return JSON.parse(text); }
  catch (e) {
    const m = String(text || "").match(/\{[\s\S]*\}/);
    if (m) { try { return JSON.parse(m[0]); } catch (e2) {} }
  }
  return null;
}

function onModelReply(msg) {
  if (msg.id === talk.pending) { onTalkReply(msg); return; }
  if (msg.id !== aware.pending) return;
  aware.pending = null;
  if (!msg.ok) return;
  const obj = parseReply(msg.text);
  if (!obj) return;
  const line = clean(obj.say, 56);
  if (line) say(line, 4);
  if (obj.do && anims[obj.do] && !pet.asleep && !pet.dragging && !talk.open) setAction(obj.do, 3);
}


/* ---------- talking to him ----------
   Click him and a line opens under his chin. Simple things are understood without
   any model at all — "dance", "come here", "play ball" — so he is useful before
   the model has loaded and if you never set one up. Anything else is a question,
   and goes to whatever small local model is configured. */

const talk = { open: false, pending: null, seq: 0, history: [], closeAt: 0, lastAsked: "" };

/* What he says when there is no model, or the model did not come back. Not an
   error message — an answer. */
const SHRUGS = ["hm", "no idea, but ok", "if you say so", "sure", "go on then",
                "i was thinking that too", "probably", "one sec… no, gone",
                "you'd know better", "mm"];
const GREETINGS = (window.CB.PERSON && window.CB.PERSON.hello) || ["hello", "hey", "hi", "there you are"];

function fallbackReply(text) {
  const t = String(text || "").toLowerCase();
  if (!t) return SHRUGS[(Math.random() * SHRUGS.length) | 0];
  if (/^(hi|hey|hello|yo|sup|morning|evening)\b/.test(t)) return GREETINGS[(Math.random() * GREETINGS.length) | 0];
  if (/\b(thanks|thank you|good|nice|love|well done)\b/.test(t)) {
    heart(pet.x, pet.y - window.CB.GRID * scale() - 6);
    return "🙂";
  }
  if (/\b(sorry|sad|tired|stressed|stuck)\b/.test(t)) return "take a break";
  if (/\b(who|what|why|how|when|where)\b/.test(t) || t.endsWith("?")) return "hm, ask me again in a bit";
  if (/\b(you|your)\b/.test(t)) return "that's me";
  return SHRUGS[(Math.random() * SHRUGS.length) | 0];
}

function pickMove() {
  const pool = (state.rotation || []).filter(k => anims[k]);
  return pool.length ? pool[(Math.random() * pool.length) | 0] : "think";
}

const COMMANDS = [
  { re: /\b(good|nice|well done|thanks|love)\b/,        run: () => { heart(pet.x, pet.y - window.CB.GRID * scale() - 6); setAction("wave", 3); return "🙂"; } },
  { re: /\b(dance|boogie|party)\b/,                     run: () => { setAction("dance", 6); return "🙂"; } },
  { re: /\b(sleep|nap|bed|goodnight|good night)\b/,     run: () => { goToBed(); return "night"; } },
  { re: /\b(wake|morning|get up)\b/,                    run: () => { getUp(); return "morning"; } },
  { re: /\b(come|here|follow me)\b/,                    run: () => { if (mouse.ok) walkTo(mouse.x, true); return "coming"; } },
  { re: /\b(ball|football|soccer|play|kick)\b/,          run: () => { startPlaying(30); return "watch this"; } },
  { re: /\b(flip|backflip|trick)\b/,                    run: () => { setAction("flip", 0.6); return "hup"; } },
  { re: /\b(jump|hop)\b/,                               run: () => { pet.vy = -520; setAction("fall", 4); return "wheee"; } },
  { re: /\b(wave|hi|hey|hello|yo)\b/,                   run: () => { setAction("wave", 3); return "hello"; } },
  { re: /\b(work|busy|focus)\b/,                        run: () => { setAction("work", 8); return "on it"; } },
  { re: /\b(coffee|drink|tea|break)\b/,                 run: () => { setAction("drink", 6); return "ahh"; } },
  { re: /\b(think|hmm|ponder)\b/,                       run: () => { setAction("think", 5); return "hmm"; } },
  { re: /\b(bigger|grow)\b/,                            run: () => { state.look.scale = Math.min(8, (state.look.scale || 4) + 1); persist(); return "big"; } },
  { re: /\b(smaller|shrink|tiny)\b/,                    run: () => { state.look.scale = Math.max(2, (state.look.scale || 4) - 1); persist(); return "small"; } },
  { re: /\b(faster|hurry|quick)\b/,                     run: () => { state.behavior.energy = Math.min(1, (state.behavior.energy || 0.5) + 0.2); persist(); return "ok!"; } },
  { re: /\b(slower|calm|settle)\b/,                     run: () => { state.behavior.energy = Math.max(0, (state.behavior.energy || 0.5) - 0.2); persist(); return "…fine"; } },
  { re: /\b(quiet|shh|hush|shut)\b/,                    run: () => { state.behavior.speech = false; persist(); return "…"; } },
  { re: /\b(talk|speak|noisy)\b/,                       run: () => { state.behavior.speech = true; persist(); return "back"; } },
  { re: /\b(hide|go away|leave)\b/,                     run: () => { send("hidePet"); return "bye"; } },
  { re: /\b(goal|net|posts)\b/,                         run: () => { putUpGoal(); return "putting it up"; } },
  { re: /\b(drone|fly|quadcopter)\b/,                   run: () => { flyDrone(); return "launching"; } },
  { re: /\b(dog|pet|puppy|walk him|walk it)\b/,          run: () => { walkTheDog(); return "come on then"; } },
  { re: /\b(climb|jump up|hop|get up there|up there)\b/, run: () => { const p = pickPlatform(); if (!p) return "nothing to jump onto"; hopTo(p); return "up we go"; } },
  { re: /\b(score|keepie|keepy|record|goals)\b/,         run: () => "best " + ((state.stats && state.stats.bestKeepies) || 0) + " · " + ((state.stats && state.stats.goals) || 0) + " goals" }
];

function persist() { send("saveState", { state: state }); }

function openTalk() {
  if (talk.open) return;
  talk.open = true;
  talk.closeAt = Date.now() / 1000 + 20;
  pet.target = null;
  setAction("idle", 9999);
  talkEl.classList.add("on");
  bubbleEl.classList.remove("on");
  send("beginTalk");
  say(Math.random() < 0.5 ? "hmm?" : "what's up", 1.6);
  setTimeout(() => { talkInput.value = ""; talkInput.focus(); }, 30);
}

function closeTalk() {
  if (!talk.open) return;
  talk.open = false;
  talkEl.classList.remove("on");
  talkInput.blur();
  send("endTalk");
  pet.hold = 0.4;
}

function submitTalk() {
  const text = talkInput.value.trim();
  talkInput.value = "";
  /* One question, one answer. He closes the line and gets on with his day rather
     than standing there with a cursor blinking at you — click him again to say
     something else. */
  closeTalk();
  if (!text) return;
  pet.lastInteraction = Date.now() / 1000;

  for (const c of COMMANDS) {
    if (c.re.test(text.toLowerCase())) { say(c.run(), 3); return; }
  }

  const a = state.awareness || {};
  if (!a.model) {
    /* No model chosen yet — answer now, and go and find one for next time. */
    say(fallbackReply(text), 4.5);
    setAction(anims.shrug ? "shrug" : pickMove(), 3.5);
    send("listModels", { endpoint: a.endpoint || "http://localhost:11434" });
    return;
  }
  say("…", 30);
  const id = "t" + (++talk.seq);
  talk.pending = id;
  talk.lastAsked = text;
  const recent = talk.history.slice(-2).map(h => "They said: " + h.q + " You said: " + h.a).join(" ");
  talk.history.push({ q: text, a: "" });
  /* If the answer never arrives at all, he still answers. */
  setTimeout(() => { if (talk.pending === id) onTalkReply({ id: id, ok: false }); }, 45000);
  send("askModel", {
    id: id, endpoint: a.endpoint, model: a.model, timeoutMs: 40000, temperature: 0.8, maxTokens: 90,
    schema: replySchema(20),
    system: (a.persona || "") +
      " You are being spoken to directly. Answer in at most twenty words, lowercase, warm and brief. Pick a move that suits your answer.",
    prompt: (recent ? recent + " " : "") + situation(aware.context) + " They say: " + text
  });
}

function onTalkReply(msg) {
  talk.pending = null;
  /* Whatever went wrong — a busy GPU, a model that answered in punctuation — he
     still says something. Being spoken to and ignored is the one outcome worth
     engineering away. */
  if (!msg.ok) { say(fallbackReply(talk.lastAsked), 4); setAction(anims.shrug ? "shrug" : pickMove(), 3.5); return; }
  const obj = parseReply(msg.text);
  const line = clean(obj && obj.say, 120) || fallbackReply(talk.lastAsked);
  if (talk.history.length) talk.history[talk.history.length - 1].a = line;
  say(line, Math.min(9, 2.5 + line.length / 18));
  if (obj.do && anims[obj.do]) setAction(obj.do, 3);
}

talkInput.addEventListener("keydown", e => {
  e.stopPropagation();
  if (e.key === "Enter") { e.preventDefault(); submitTalk(); }
  else if (e.key === "Escape") { e.preventDefault(); closeTalk(); }
  else talk.closeAt = Date.now() / 1000 + 25;
});


/* ---------- things he gets up to ----------
   A goal he puts up himself, a drone he flies, and his own small pet on a leash.
   All three are floor-only: he does not take the dog up a wall. */

/* Yesterday's goals are yesterday's. The tally starts again each day. */
function today() { return new Date().toISOString().slice(0, 10); }
function rollGoalDay() {
  if (state.stats.goalsDate !== today()) {
    state.stats.goals = 0;
    state.stats.goalsDate = today();
  }
}

const goalScale = () => Math.max(2, scale() - 1);
const goalW = () => 16 * goalScale();
const goalH = () => 7 * goalScale();

function putUpGoal() {
  if (goal || !onFloor()) return;
  const dir = pet.facing || 1;
  goal = {
    x: Math.max(minX() + goalW(), Math.min(maxX() - goalW(), pet.x + dir * 130)),
    y: ground(), stage: 0, t: 0, until: Date.now() / 1000 + 50
  };
  setAction("work", 2.4);
  say("hold on", 2);
}

function updateGoal(dt) {
  if (!goal) return;
  goal.t += dt;
  if (goal.stage < 2 && goal.t > 0.9 * (goal.stage + 1)) goal.stage++;
  if (goal.stage === 2 && !ball && Date.now() / 1000 < goal.until - 6) {
    takeOutBall();
    play.until = goal.until;
  }
  if (ball && goal.stage === 2) {
    const inMouth = Math.abs(ball.x - goal.x) < goalW() / 2 - 4 && ball.y > ground() - goalH();
    if (inMouth && !ball.scored) {
      ball.scored = true;
      rollGoalDay();
      state.stats.goals = (state.stats.goals || 0) + 1;
      say(["goal!", "get in", "" + state.stats.goals + " today"][(Math.random() * 3) | 0], 3);
      heart(goal.x, ground() - goalH() - 10);
      puff(ball.x, ground(), 2);
      setAction(anims.clap ? "clap" : "cheer", 2.5);
      setTimeout(() => { if (!pet.dragging && !pet.asleep) setAction("cheer", 2.5); }, 2600);
      persist();
      ball.vx = 0; ball.vy = -40;
      setTimeout(() => { if (ball) { ball.x = pet.x + (pet.facing || 1) * 24; ball.scored = false; } }, 900);
    }
  }
  if (Date.now() / 1000 > goal.until) { goal = null; putAwayBall(); }
}

function flyDrone() {
  if (drone || !onFloor()) return;
  drone = { t: 0, alpha: 0, x: pet.x, y: ground() - 90, until: Date.now() / 1000 + 22 };
  setAction("work", 3);
  say("watch it go", 2.4);
}

function updateDrone(dt) {
  if (!drone) return;
  drone.t += dt;
  const leaving = Date.now() / 1000 > drone.until;
  drone.alpha = leaving ? drone.alpha - dt * 1.6 : Math.min(1, drone.alpha + dt * 2);
  if (drone.alpha <= 0) { drone = null; return; }
  const reach = 70 + 26 * Math.sin(drone.t * 0.6);
  drone.x = pet.x + Math.cos(drone.t * 1.05) * reach;
  drone.y = ground() - 96 - Math.sin(drone.t * 2.1) * 20 + (leaving ? 60 * (1 - drone.alpha) : 0);
  if (!leaving && pet.action === "idle" && Math.random() < dt * 1.2) setAction("work", 3);
}

function walkTheDog() {
  if (mini || !onFloor()) return;
  mini = {
    x: pet.x - (pet.facing || 1) * 46, y: ground(), frame: 0, frameT: 0,
    facing: pet.facing || 1, alpha: 0, moving: false, until: Date.now() / 1000 + 50
  };
  say("come on then", 2.4);
}

function updateMini(dt) {
  if (!mini) return;
  const leaving = Date.now() / 1000 > mini.until;
  mini.alpha = leaving ? mini.alpha - dt * 1.5 : Math.min(1, mini.alpha + dt * 2);
  if (mini.alpha <= 0) { mini = null; return; }
  mini.y = ground();
  const want = pet.x - (pet.facing || 1) * 44;
  const d = want - mini.x;
  if (Math.abs(d) > 4) {
    const sp = Math.min(150, Math.abs(d) * 2.6);
    mini.x += Math.sign(d) * sp * dt;
    mini.facing = Math.sign(d);
    mini.moving = true;
  } else mini.moving = false;
  const a = mini.moving ? anims.walk : anims.idle;
  mini.frameT += dt;
  const step = 1 / a.fps;
  while (mini.frameT >= step) { mini.frameT -= step; mini.frame = (mini.frame + 1) % a.frames.length; }
}

let bed = null;
const checkin = { last: Date.now() / 1000 };

/* He asks how it is going, on a timer rather than at random, because a check-in
   that lands four times in ten minutes is not a check-in. */
function checkInLine() {
  const app = (aware.context && aware.context.app) || "";
  const own = (window.CB.PERSON && window.CB.PERSON.checkIns) || null;
  const lines = own || ["how's it going?", "any progress?", "how are we doing?",
                        app ? "still in " + app + "?" : "what are we on?", "need anything?"];
  return window.CB.addressed(lines[(Math.random() * lines.length) | 0]);
}

function maybeCheckIn() {
  const b = state.behavior;
  if (b.checkIn === false) return false;
  const now = Date.now() / 1000;
  const gap = Math.max(5, Number(b.checkInMinutes) || 45) * 60;
  if (now - checkin.last < gap) return false;
  if (pet.asleep || pet.dragging || talk.open) return false;
  checkin.last = now;

  const soon = birthdaySoon();
  if (soon && Math.random() < 0.4) {
    say(soon.name + "'s birthday in " + soon.days + (soon.days === 1 ? " day" : " days"), 6);
    setAction("think", 3);
    return true;
  }

  const a = state.awareness || {};
  if (a.enabled && a.model) {
    const id = "r" + (++aware.seq);
    aware.pending = id;
    aware.lastAsk = now;
    send("askModel", {
      id: id, endpoint: a.endpoint, model: a.model, timeoutMs: 30000, temperature: 0.9, maxTokens: 60,
      schema: replySchema(9),
      system: (a.persona || "") + " Keep every reply to at most eight lowercase words.",
      prompt: "You have not checked on them in a while. " + situation(aware.context) +
              " Ask how it is going — one short friendly question — and pick a move."
    });
    setAction("wave", 3);
    /* if the model says nothing, he still checks in */
    setTimeout(() => { if (aware.pending === id) { aware.pending = null; say(checkInLine(), 6); } }, 32000);
    return true;
  }

  say(checkInLine(), 6);
  setAction(Math.random() < 0.5 ? "wave" : "think", 3);
  return true;
}

/* Going to bed rather than switching off where he stands. */
function goToBed() {
  if (state.behavior.useBed === false || !onFloor()) { setAction("sleep", 9999); return; }
  putAwayBall();
  bed = { x: pet.x + (pet.facing || 1) * 6, stage: 0, alpha: 0, t: 0 };
  setAction("work", 1.3);
  if (Math.random() < 0.6) say("right, that's me", 3);
}

function updateBed(dt) {
  if (!bed) return;
  bed.t += dt;
  bed.alpha = bed.out ? Math.max(0, bed.alpha - dt * 2) : Math.min(1, bed.alpha + dt * 3);
  if (bed.out && bed.alpha <= 0) { bed = null; return; }
  if (!bed.out && bed.stage === 0 && bed.t > 0.8) bed.stage = 1;
  if (!bed.out && bed.stage === 1 && bed.t > 1.4 && pet.action !== "abed") {
    pet.x = bed.x;
    setAction("abed", 9999);
  }
}

function getUp() {
  if (bed) bed.out = true;
  setAction("idle", 1.2);
}

const busy = () => Boolean(goal || drone || mini || bed || isPlaying());

/* You drew him something new. He notices. */
function celebrate(key) {
  const name = (anims[key] && anims[key].name) || key;
  state.stats.gifts = (state.stats.gifts || 0) + 1;
  state.stats.happiness = Math.min(1, (state.stats.happiness || 0.5) + 0.2);
  persist();
  putAwayBall();
  setAction(key, 6);
  for (let i = 0; i < 3; i++) {
    setTimeout(() => heart(pet.x + (Math.random() * 40 - 20), pet.y - window.CB.GRID * scale() - 6), i * 260);
  }
  say("a new one — " + name + "!", 6);
}

/* If Ollama is running and nothing has been chosen, he chooses: the smallest model
   that can hold a conversation. Embedding models are not those. */
function adoptModel(list) {
  const a = state.awareness || {};
  if (a.model || !Array.isArray(list) || !list.length) return;
  const chatty = list.filter(m => m.name && !/embed/i.test(m.name));
  if (!chatty.length) return;
  chatty.sort((x, y) => (x.size || 0) - (y.size || 0));
  state.awareness.model = chatty[0].name;
  persist();
}

/* ---------- pointer ---------- */
let clickTimer = null;
cv.addEventListener("pointerdown", e => {
  if (e.button !== 0) { send("openStudio"); return; }
  pet.lastInteraction = Date.now() / 1000;
  pet.dragging = true;
  pet.grabDX = pet.x - (mouse.ok ? mouse.x : winX + e.clientX);
  pet.grabDY = pet.y - (mouse.ok ? mouse.y : winY + e.clientY);
  pet.vx = pet.vy = 0;
  setAction("held", 9999);
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener("pointerup", () => {
  if (!pet.dragging) return;
  pet.dragging = false;
  setAction("fall", 9999);
});
cv.addEventListener("dblclick", () => {
  clearTimeout(clickTimer);
  pet.lastInteraction = Date.now() / 1000;
  setAction("flip", 0.6);
});
cv.addEventListener("click", () => {
  if (!state.behavior.clickReact) return;
  pet.lastInteraction = Date.now() / 1000;
  if (pet.asleep) { getUp(); say("…up, up"); return; }
  clearTimeout(clickTimer);
  clickTimer = setTimeout(() => {
    if (isPlaying()) { tryKickHard(); return; }
    if (state.behavior.talkOnClick !== false) { openTalk(); return; }
    pet.vy = -430;
    setAction("fall", 9999);
    if (Math.random() < 0.55) say(randomPhrase());
  }, 190);
});
function tryKickHard() {
  if (!ball) return;
  ball.vx = pet.facing * 150; ball.vy = -340;
  setAction("kick", 0.45);
}

/* ---------- loop ---------- */
let last = performance.now();
function tick(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  update(dt);
  render();
  place();
  requestAnimationFrame(tick);
}

function update(dt) {
  const b = state.behavior;
  const g = ground();
  if (!pet.dragging && !talk.open) checkBirthday();

  updateBall(dt);
  updateEffects(dt);
  updateGoal(dt);
  updateBed(dt);
  tickStamina(dt);
  updateDrone(dt);
  updateMini(dt);

  if (talk.open) {
    if (Date.now() / 1000 > talk.closeAt) closeTalk();
    else if (!pet.dragging) { advance(dt); return; }   /* he stands still and listens */
  }

  if (pet.dragging && day.routine) day.routine = null;   /* picked up mid-meal */
  if (day.routine && !pet.dragging && onFloor()) { runRoutine(dt); advance(dt); return; }

  /* a nap ends by itself, and he gets up stiff */
  if (pet.action === "nap" && pet.actionT > pet.hold) {
    day.stamina = Math.max(day.stamina, 0.8);
    setAction("stretch", 3.5);
  }

  if (pet.dragging) {
    if (mouse.ok) {
      const nx = mouse.x + pet.grabDX, ny = mouse.y + pet.grabDY;
      pet.vx = (nx - pet.x) / Math.max(dt, 0.001) * 0.25;
      pet.vy = (ny - pet.y) / Math.max(dt, 0.001) * 0.25;
      pet.x = nx; pet.y = ny;
    }
    clampX();
    advance(dt);
    return;
  }

  if (pet.surface !== "platform" && (pet.action === "fall" || pet.y < g - 0.5)) {
    if (pet.action !== "fall" && pet.action !== "land" && pet.action !== "flip") setAction("fall", 9999);
    const wasFast = pet.vy;
    const before = pet.y;
    pet.vy += (b.gravity || 1400) * dt;
    pet.y += pet.vy * dt;
    pet.x += pet.vx * dt;
    pet.vx *= 0.985;
    if (pet.x <= minX() || pet.x >= maxX()) { pet.vx = -pet.vx * 0.5; clampX(); }

    /* anything on screen with a top edge is a shelf: coming down over one, he lands */
    if (usePlatforms() && pet.vy > 0) {
      for (const p of platforms) {
        if (before <= p.y && pet.y >= p.y && pet.x > p.x0 + 4 && pet.x < p.x1 - 4 && p.y < g - 8) {
          landOn(p);
          return advance(dt);
        }
      }
    }

    if (pet.y >= g) {
      pet.y = g;
      pet.platform = null;
      pet.surface = "floor";
      if (pet.vy > 700) { pet.vy = -pet.vy * 0.28; puff(pet.x, g, 3); }
      else {
        if (wasFast > 260) puff(pet.x, g, 2);
        else if (wasFast > 40 && Math.random() < 0.5) heart(pet.x, g - window.CB.GRID * scale() - 6);
        pet.vy = 0; pet.vx = 0; setAction("land", 0.32);
      }
    }
  } else if (pet.action === "walk" || pet.action === "run") {
    const speed = pet.action === "run" ? (b.runSpeed || 74) : (b.walkSpeed || 26);
    const axis = surfaceDef().axis;
    const at = pet[axis];
    const dir = pet.target != null ? (Math.sign(pet.target - at) || pet.dir) : pet.dir;
    pet.dir = dir || 1;
    pet.facing = pet.dir;
    pet[axis] = at + pet.dir * speed * dt;

    if (pet.target != null && Math.abs(pet.target - pet[axis]) < speed * dt + 1) {
      pet[axis] = pet.target; pet.target = null; setAction("idle", 0.8 + Math.random());
    }

    const { min, max } = surfaceBounds();
    if (pet[axis] <= min) { pet[axis] = min; atEnd(-1); }
    else if (pet[axis] >= max) { pet[axis] = max; atEnd(1); }


  } else if (pet.action === "jump" && pet.pendingHop) {
    if (pet.actionT > 0.34) launchHop(pet.pendingHop);
  } else if (pet.action === "land" || pet.action === "kick" || pet.action === "flip" || pet.action === "jump") {
    if (pet.actionT > pet.hold) setAction("idle", isPlaying() ? 0.15 : 1);
  }

  if (isPlaying()) tryKick(dt);

  pet.actionT += dt;
  const free = !pet.asleep && !pet.pendingHop && ["fall", "land", "kick", "flip", "jump"].indexOf(pet.action) < 0;
  if (free && pet.actionT > pet.hold) {
    const gap = isPlaying() ? 0.15 : 0.6 + (1 - (b.energy == null ? 0.5 : b.energy)) * 3.5;
    if (pet.actionT > pet.hold + Math.random() * gap) decide();
  }
  if (pet.asleep) {
    const near = mouse.ok && Math.abs(mouse.x - pet.x) < 70 && Math.abs(mouse.y - pet.y) < 90;
    if (near) { pet.lastInteraction = Date.now() / 1000; getUp(); say("hm?"); }
  }
  advance(dt);
}

/* What happens when he reaches the end of what he is standing on. Screen edges are
   just edges — he turns round. The interesting case is running out of toolbar. */
function atEnd(side) {
  pet.target = null;

  if (pet.surface === "platform") {
    const next = pickPlatform();
    if (next && Math.random() < 0.6) { hopTo(next); return; }
    if (Math.random() < 0.5) { letGo(); return; }      /* steps off and drops home */
    pet.dir = -side;
    setAction("walk", 8);
    return;
  }

  pet.dir = -side;
  setAction("idle", 0.6 + Math.random());
}

function advance(dt) {
  const a = anims[pet.action] || anims.idle;
  pet.frameT += dt;
  const step = 1 / a.fps;
  while (pet.frameT >= step) {
    pet.frameT -= step;
    if (pet.frame + 1 >= a.frames.length) pet.frame = a.loop ? 0 : a.frames.length - 1;
    else pet.frame++;
  }
}

function render() {
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== WIN_W * dpr) { cv.width = WIN_W * dpr; cv.height = WIN_H * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, WIN_W, WIN_H);
  ctx.imageSmoothingEnabled = false;

  const a = anims[pet.action] || anims.idle;
  const f = Math.min(pet.frame, a.frames.length - 1);
  const s = scale();
  const CBx = window.CB;
  const lift = Math.max(0, ground() - pet.y);
  const airborne = pet.surface === "floor" && lift > 1;
  const angle = surfaceDef().angle;
  const groundWin = BASE_Y + Math.min(120, lift);

  if (state.look.shadow && !pet.dragging) {
    const y = pet.surface === "platform" ? BASE_Y : groundWin;
    if (y < WIN_H - 1) CBx.drawShadow(ctx, CX, y, s, airborne ? 0.10 : 0.18);
  }

  /* the bed goes down before he does */
  if (bed) {
    window.CB.drawProp(ctx, "bed", bed.stage, {
      cx: toWinX(bed.x), baseY: toWinY(ground()), scale: s, alpha: bed.alpha
    });
  }

  /* the goal he put up stands behind him */
  if (goal) {
    CBx.drawProp(ctx, "goal", goal.stage, {
      cx: toWinX(goal.x), baseY: toWinY(ground()), scale: goalScale()
    });
  }

  /* props that belong to what he is doing */
  if (state.behavior.useProps && !pet.dragging && !airborne && onFloor()) {
    if (pet.action === "work" && !drone) CBx.drawProp(ctx, "laptop", Math.floor(pet.frame / 2), {
      cx: CX + pet.facing * (s * 8.5), cy: BASE_Y - s * 2, scale: Math.max(2, s * 0.7) });
    if (pet.action === "drink") CBx.drawProp(ctx, "mug", Math.floor(Date.now() / 400), {
      cx: CX + pet.facing * (s * 8.5), cy: BASE_Y - s * 2, scale: Math.max(2, s * 0.7) });
  }

  /* his own pet, and the leash between them */
  if (mini) {
    const ms = Math.max(2, s * 0.62);
    const ma = mini.moving ? anims.walk : anims.idle;
    const mf = Math.min(mini.frame, ma.frames.length - 1);
    const mx = toWinX(mini.x), my = toWinY(mini.y);
    if (state.look.shadow) CBx.drawShadow(ctx, mx, my, ms, 0.14 * mini.alpha);
    ctx.save();
    ctx.globalAlpha = mini.alpha;
    ctx.strokeStyle = window.CB.resolveColors(state.look.colors).dark;
    ctx.lineWidth = Math.max(1, s / 3);
    ctx.beginPath();
    const handX = CX + pet.facing * s * 7, handY = BASE_Y - s * 4.5;
    const headY = my - CBx.GRID * ms * 0.7;
    ctx.moveTo(handX, handY);
    ctx.quadraticCurveTo((handX + mx) / 2, Math.max(handY, headY) + s * 3, mx, headY);
    ctx.stroke();
    ctx.restore();
    CBx.drawFrame(ctx, ma.frames[mf], {
      cx: mx, baseY: my + (CBx.GRID - CBx.FOOT_ROW) * ms, scale: ms, palette: miniPalette,
      flip: mini.facing < 0, bob: ma.bob[mf] || 0, alpha: mini.alpha
    });
  }

  /* lying down, he lies ON the mattress rather than inside it */
  const bedLift = (pet.action === "abed" && bed) ? 2 * s : 0;
  CBx.drawFrame(ctx, a.frames[f], {
    cx: CX, baseY: BASE_Y + (CBx.GRID - CBx.FOOT_ROW) * s - bedLift, scale: s, palette: palette, angle: angle,
    flip: pet.facing < 0, bob: a.bob[f] || 0, alpha: state.look.opacity == null ? 1 : state.look.opacity
  });

  /* a birthday: the hat stays on whatever he is doing, and the cake comes out */
  const bday = whoseBirthday();
  const wearsHatAlready = ["party", "cake", "blow", "present", "chef"].indexOf(pet.action) >= 0;
  if (bday && !pet.dragging) {
    const topRow = CBx.topRowOf(a.frames[f]);
    const headY = BASE_Y + (CBx.GRID - CBx.FOOT_ROW) * s - (CBx.GRID - topRow) * s;
    if (!wearsHatAlready) {
      CBx.drawProp(ctx, "hat", 0, { cx: CX, baseY: headY + 1, scale: Math.max(2, s) });
    }
    if (pet.action === "cake" || pet.action === "blow") {
      const lit = pet.action === "blow" && (pet.frame === 1 || pet.frame === 2) ? 2 : 0;
      /* held out in front of him, at the height his hands are */
      CBx.drawProp(ctx, "cake", lit, {
        cx: CX + pet.facing * s * 8, baseY: BASE_Y - s * 3, scale: Math.max(2, s * 0.9)
      });
    }
    if (pet.action === "present" && pet.frame < 3) {   /* 1.5s of box before he is out */
      CBx.drawProp(ctx, "present", Math.min(pet.frame, 2), {
        cx: CX, baseY: BASE_Y + 1, scale: Math.max(2, s * 1.05)
      });
    }
  }

  /* the drone, above everything */
  if (drone) {
    CBx.drawProp(ctx, "drone", Math.floor(drone.t * 20), {
      cx: toWinX(drone.x), cy: toWinY(drone.y), scale: Math.max(2, s - 2), alpha: drone.alpha
    });
  }

  if (ball) {
    const r = ballR();
    CBx.drawShadow(ctx, toWinX(ball.x), BASE_Y + Math.min(80, lift), Math.max(2, r * 0.6), 0.12 * ball.alpha);
    CBx.drawBall(ctx, { cx: toWinX(ball.x), cy: toWinY(ball.y), r: r, angle: ball.angle, alpha: ball.alpha });
  }

  for (const e of effects) {
    CBx.drawProp(ctx, e.name, 0, {
      cx: toWinX(e.x), cy: toWinY(e.y), scale: e.scale, alpha: Math.max(0, 1 - e.t / e.life)
    });
  }
}

/* window follows him; the bubble sits just above his head */
function place() {
  const nx = Math.round(pet.x - CX), ny = Math.round(pet.y - BASE_Y);
  if (nx !== winX || ny !== winY) { winX = nx; winY = ny; send("move", { x: nx, y: ny }); }

  const s = scale();
  const a0 = anims[pet.action] || anims.idle;
  const f0 = a0.frames[Math.min(pet.frame, a0.frames.length - 1)];
  const top = BASE_Y + (window.CB.GRID - window.CB.FOOT_ROW) * s - (window.CB.GRID - window.CB.topRowOf(f0)) * s;
  const hatRoom = (whoseBirthday() && ["party", "cake", "blow", "present", "chef"].indexOf(pet.action) < 0)
    ? 4 * s : 0;
  const wantBottom = Math.round(WIN_H - top + 6 + hatRoom);
  if (wantBottom !== bubbleBottom) {
    bubbleBottom = wantBottom;
    bubbleEl.style.bottom = wantBottom + "px";
    talkEl.style.bottom = wantBottom + "px";
  }

  if (mouse.ok) {
    /* his body sits "above" his feet, whichever way up that happens to be */
    const a1 = anims[pet.action] || anims.idle;
    const f1 = a1.frames[Math.min(pet.frame, a1.frames.length - 1)];
    const tall = (window.CB.FOOT_ROW - window.CB.topRowOf(f1)) * s;
    const halfW = (window.CB.GRID * s) / 2 + 8;
    const over = pet.dragging || talk.open ||
      (Math.abs(mouse.x - pet.x) < halfW && mouse.y > pet.y - tall - 10 && mouse.y < pet.y + 10);
    if (over !== hovering) {
      hovering = over;
      if (ignoring === over) { ignoring = !over; send("setIgnoreMouse", { value: ignoring }); }
    }
  }
}

setInterval(() => {
  const phase = phaseNow();
  send("vitals", {
    stamina: Math.round(day.stamina * 100) / 100,
    phase: phase.key, phaseTitle: phase.title,
    action: pet.action, animName: (anims[pet.action] || {}).name || pet.action,
    asleep: pet.asleep, meals: state.stats.meals || {}
  });
}, 4000);

send("ready");
setTimeout(() => {
  const a = state.awareness || {};
  if (!a.model) send("listModels", { endpoint: a.endpoint || "http://localhost:11434" });
}, 1500);
requestAnimationFrame(tick);
</script>
</body>
</html>
